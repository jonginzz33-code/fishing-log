<script>
function form_check(f)
{
        var obj = document.getElementsByName("PA_N_UID");
    var obj_true = 0;
    for(var j = 0; j < obj.length; j++)
    {
        if(obj[j].checked == true)
        {
            obj_true = 1;
            break;
        }
    }
    if(obj_true != 1)
    {
        alert('배를 선택해 주십시오.');
        return false;
    }

    

    var obj = document.getElementsByName("PS_N_UID");
    var obj_true = 0;
    for (var j = 0; j < obj.length; j++)
    {
        if (obj[j].checked == true)
        {
            obj_true = 1;
            break;
        }
    }
    if (obj_true != 1)
    {
		alert('낚시종류를 선택해 주십시오.');
		return false;
    }

	if(!f.BI_IN.value)
	{
        		alert('인원을 선택해 주십시오.');
                f.BI_IN.focus();
		return false;
	}

    if($('#temp_bi_stat').val() == "확인")
    {
                //좌석선택불가, 예약시 좌석안내사진으로 사용합니다
                if($('#seat_img').length > 0) //선택된 좌석이 있다면:
        {
                        var BI_IN = $('#BI_IN').val();
            var total_in = Number(BI_IN); //대인만
            
            var obj = document.getElementsByName("seat[]");
            var obj_seat_num = 0;
            for (var j = 0; j < obj.length; j++)
            {
                if (obj[j].value != '')
                {
                    ++obj_seat_num;
                }
            }

            if(BI_IN != '독배')
            {
                if (obj_seat_num != total_in)
                {
                    alert('좌석 '+total_in+'개를 선택해주십시오, 현재 '+obj_seat_num+'개 선택하셨습니다.');
                    return false;
                }
            }
        }
            }

	if(!f.BI_NAME.value)
	{
		alert('예약자 성함을 입력해 주십시오.      ');
		f.BI_NAME.focus();
		return false;
	}
	if(!f.BI_TEL1.value)
	{
		alert('핸드폰번호를 입력해 주십시오.      ');
		f.BI_TEL1.focus();
		return false;
	}
    if(!f.BI_TEL2.value)
	{
		alert('핸드폰번호를 입력해 주십시오.      ');
		f.BI_TEL2.focus();
		return false;
	}
	if(!f.BI_TEL3.value)
	{
		alert('핸드폰번호를 입력해 주십시오.      ');
		f.BI_TEL3.focus();
		return false;
	}
        if(f.agree[0].checked == false)
    {
		alert('개인정보 수집 및 이용 약관 동의 하셔야합니다.');
		f.agree[0].focus();
		return false;
    }
    if(f.BI_3JA[0].checked == false)
    {
		alert('제3자 정보제공 동의 하셔야합니다.');
		f.BI_3JA[0].focus();
		return false;
    }
    if(f.BI_AD[0].checked == false && f.BI_AD[1].checked == false)
    {
		alert('광고성 정보 수신 동의여부 체크 하셔야합니다.');
		f.BI_AD[0].focus();
		return false;
    }
    
    var ye = $('#id_ye').html();
    var buga_total = "";
    if($('#id_buga_total').length > 0)
    {
        var buga_total = $('#id_buga_total').html();
    }
    var data = 'ye='+ye+'&buga_total='+buga_total;
    $.ajax({
        type:"POST",
        url:"/_core/module/reservation_boat_v5.2_seat1/action/popup.step1.price.php",
        data:data,
        success:function(html)
        {
            if(html != 1)
            {

            }
        }
    });

        if($('#submit').html() == "대기자내용확인")
    {
        if(!confirm('대기자로 예약하실 내용을 확인하시겠습니까?'))
        {
            return false;
        }
    }
    else
    {
        if(!confirm($('#submit').html()+' 하시겠습니까?'))
        {
            return false;
        }
    }
    }
function agree_check(str)
{
    var f = document.insert_form;

    if(str == "Y")
    {
        f.agree[0].checked = true;
        f.BI_3JA[0].checked = true;
        f.BI_AD[0].checked = true;
    }
    else
    {
        f.agree[1].checked = true;
        f.BI_3JA[1].checked = true;
        f.BI_AD[1].checked = true;
    }
}
