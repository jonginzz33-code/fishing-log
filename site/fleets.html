<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>배 선단 보기</title>
<link rel="icon" href="img/jogwa.png">
<style>
/* 배 선단 보기 (시험) — 선상24 · 더피싱 선단 홈페이지 모음 · 고른 날 일정 바로 가기 */
:root{--bg:#0A1620;--card:#12283A;--line:#2C4F66;--text:#EAF2F6;--sub:#9FB4C2;--sky:#7FD6FF;--ok:#2FBF8F;--bad:#FF8A8A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55}
a{color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 40px}
nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 58px 16px 0;border-bottom:1px solid #1E3446}
.logo{font-size:20px;font-weight:900;text-decoration:none}.logo span{color:var(--sky)}
.who{font-size:13px;color:var(--sub);text-align:right}
h2{font-size:18px;margin:22px 0 10px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.btn{display:inline-block;border:0;border-radius:20px;padding:10px 16px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
.btn.ok{background:var(--ok);color:#04222A}.btn.ghost{background:transparent;color:#DDEAF2;border:1.5px solid #3A6A88}
.btn.bad{background:transparent;color:var(--bad);border:1.5px solid #6A3A3A}.btn.sm{padding:6px 12px;font-size:13px}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input,textarea{width:100%;background:#0F2231;color:var(--text);border:1.5px solid #3A6A88;border-radius:12px;padding:10px 12px;font-size:15px;font-family:inherit}
textarea{min-height:140px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.item{display:flex;gap:10px;align-items:center;border-top:1px solid #1E3446;padding:10px 0}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}.item b{display:block}.item small{color:var(--sub);word-break:break-all}
.note{font-size:13px;color:var(--sub)}
.msg{font-size:14px;margin-top:8px;min-height:20px}
.hide{display:none}
.warn{background:#3A2410;border:1.5px solid #E8892A;border-radius:14px;padding:12px 14px;font-size:14px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1.5px solid #3A6A88;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:800;cursor:pointer;background:transparent;color:#DDEAF2;font-family:inherit}
.chip.on{background:#2E8FB8;border-color:#7FD6FF;color:#fff}
.tag{font-size:11px;color:#fff;border-radius:6px;padding:1px 6px;margin-left:4px;font-weight:800}
.fleet{border-top:1px solid #1E3446;padding:12px 0}.fleet:first-child{border-top:0}
.fleet b{font-size:16px}.ships{font-size:13px;color:#B8CAD6;margin:2px 0 8px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
input[type=date]{width:auto;color-scheme:dark}
</style>
</head>
<body>
<div class="wrap">
<nav>
  <a class="logo" href="/"><span>talla</span>.co.kr · 배 선단</a>
  <div class="who">시험 페이지</div>
</nav>
<h2>🚤 배 선단 보기</h2>
<div class="card">
  <div class="row" style="margin-top:0"><label style="margin:0">📅 날짜</label><input type="date" id="day"></div>
  <input id="q" placeholder="배 이름 · 항구 · 지역 · 선단 (예: 백호, 오천항, 무창포, 안면도)" style="margin-top:10px">
  <div class="chips" id="src"></div>
  <div class="note" id="cnt" style="margin-top:8px">목록 불러오는 중…</div>
</div>
<div class="card"><div id="res" class="note">위에 배 이름이나 항구를 적어 주세요.</div></div>
<p class="note">선단 홈페이지 일정은 그 사이트에서 열려요 (남은 자리 · 예약은 거기서). 자리 숫자를 이 페이지에 바로 모아 보여 주는 건 다음 단계예요.</p>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  var t = new Date(); $('day').value = t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
  var fleets = {};   // host -> {src, name, area, ships:{}, tel}
  function add(src, host, ship, area, fleet, tel) {
    if (!host) return; host = String(host).toLowerCase();
    var f = fleets[host] || (fleets[host] = { src: src, host: host, name: '', area: '', ships: {}, tel: '' });
    if (fleet && !f.name) f.name = fleet; if (area && !f.area) f.area = area; if (tel && !f.tel) f.tel = tel;
    if (ship) f.ships[String(ship).trim()] = 1;
  }
  var SRC = { '선상24 선단': '#3D7BD9', '더피싱 선단': '#2FA06F' };
  var on = { '선상24 선단': true, '더피싱 선단': true };
  var left = 2;
  function ready() { if (--left > 0) return; $('cnt').textContent = '선단 ' + Object.keys(fleets).length + '곳 · 배 ' + Object.keys(fleets).reduce(function (n, h) { return n + Object.keys(fleets[h].ships).length; }, 0) + '척'; draw(); }
  fetch('data/seat_sites.json').then(function (r) { return r.json(); }).then(function (j) {
    var o = j.ships || {};
    Object.keys(o).forEach(function (no) { var s = o[no]; if (s.h && /\.sunsang24\.com$/.test(s.h)) add('선상24 선단', s.h, s.n, s.p, '', s.t); });
  }).catch(function () {}).then(ready);
  fetch('data/tf_sites.json').then(function (r) { return r.json(); }).then(function (j) {
    (j.j || []).forEach(function (x) { add('더피싱 선단', x[6], x[1], x[2], String(x[3] || '').split(' (')[0], ''); });
  }).catch(function () {}).then(ready);
  $('src').innerHTML = Object.keys(SRC).map(function (k) { return '<button class="chip on" data-k="' + k + '">' + k + '</button>'; }).join('');
  $('src').querySelectorAll('[data-k]').forEach(function (b) { b.onclick = function () { on[b.dataset.k] = !on[b.dataset.k]; b.classList.toggle('on', on[b.dataset.k]); draw(); }; });
  function dayUrl(f, d) {
    var y = d.slice(0, 4), m = d.slice(5, 7), dd = d.slice(8, 10);
    if (f.src === '선상24 선단') return 'https://' + f.host + '/ship/schedule_fleet/' + y + m;
    return 'https://' + f.host + '/index.php?mid=bk&year=' + y + '&month=' + m + '&day=' + dd + '#list';
  }
  function draw() {
    var k = $('q').value.replace(/\s/g, '').replace(/호$/, '');
    if (!k) { $('res').innerHTML = '위에 배 이름이나 항구를 적어 주세요.'; return; }
    var d = $('day').value;
    var out = Object.keys(fleets).map(function (h) { return fleets[h]; }).filter(function (f) {
      if (!on[f.src]) return false;
      return [f.name, f.area, f.host].concat(Object.keys(f.ships)).some(function (v) { return String(v || '').replace(/\s/g, '').indexOf(k) >= 0; });
    });
    $('res').innerHTML = out.length ? out.slice(0, 40).map(function (f) {
      var ships = Object.keys(f.ships);
      return '<div class="fleet"><b>' + esc(f.name || f.host.split('.')[0]) + '</b><span class="tag" style="background:' + SRC[f.src] + '">' + esc(f.src) + '</span>' +
        '<div class="note">' + esc([f.area, f.host, f.tel].filter(Boolean).join(' · ')) + '</div>' +
        '<div class="ships">🚤 ' + esc(ships.slice(0, 10).join(' · ')) + (ships.length > 10 ? ' 외 ' + (ships.length - 10) + '척' : '') + '</div>' +
        '<div class="btns"><a class="btn ok sm" href="' + esc(dayUrl(f, d)) + '" target="_blank" rel="noopener">📅 ' + esc(d.slice(5).replace('-', '/')) + ' 일정 · 자리</a>' +
        (f.src === '선상24 선단' ? '<a class="btn ghost sm" href="https://' + esc(f.host) + '/ship/board" target="_blank" rel="noopener">📝 조과</a>' : '') +
        '<a class="btn ghost sm" href="https://' + esc(f.host) + '" target="_blank" rel="noopener">🌐 홈페이지</a>' +
        (f.tel ? '<a class="btn ghost sm" href="tel:' + esc(f.tel) + '">📞</a>' : '') + '</div></div>';
    }).join('') + (out.length > 40 ? '<div class="note">… ' + out.length + '곳 중 40곳</div>' : '') : '못 찾았어요 · 띄어쓰기 없이 몇 글자만 적어 보세요';
  }
  $('q').oninput = draw; $('day').onchange = draw;
})();
</script>
<script src="/menu.js"></script>
</body>
</html>
