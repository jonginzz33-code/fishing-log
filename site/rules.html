<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>규칙 복사</title>
<style>body{margin:0;background:#0f2233;color:#e8f2f8;font-family:sans-serif;padding:16px}
button{width:100%;font-size:22px;padding:18px;border:0;border-radius:14px;background:#2E8FB8;color:#fff;font-weight:bold}
textarea{width:100%;height:55vh;margin-top:14px;background:#08151f;color:#cfe;border:1px solid #3A6A88;border-radius:10px;font-size:11px;box-sizing:border-box}
p{font-size:15px;line-height:1.5}body{padding-top:70px}</style></head><body>
<button id="b">📋 규칙 전부 복사</button>
<p id="m">누르면 복사돼요 → Firebase 규칙 칸 전부 지우고 붙여 넣기 → [게시]</p>
<textarea id="t" readonly></textarea>
<script>
const t=document.getElementById('t'),m=document.getElementById('m');
fetch('rules.txt?'+Date.now()).then(r=>r.text()).then(s=>{t.value=s;m.textContent+=' ('+s.split('\n').length+'줄)'});
document.getElementById('b').onclick=async()=>{try{await navigator.clipboard.writeText(t.value)}catch(e){t.select();document.execCommand('copy')}m.textContent='✅ 복사됐어요! 이제 Firebase 규칙 칸에 붙여 넣고 [게시]'};
</script><script src="/menu.js"></script>
</body></html>
