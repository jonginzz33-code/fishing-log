<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>조과일지 웹</title>
<link rel="icon" href="img/jogwa.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* 🎣 조과일지 웹 (보기 전용) — 앱과 같은 구글 계정으로 로그인 · 내 조과 · 그룹 출조 기록 · 전체 게시판 */
:root{--bg:#0A1620;--card:#12283A;--line:#2C4F66;--text:#EAF2F6;--sub:#9FB4C2;--sky:#7FD6FF;--mine:#E8892A;--group:#2E8FB8;--all:#8A63D2;--ok:#2FBF8F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 60px}
nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 58px 14px 0;border-bottom:1px solid #1E3446}
.logo{font-size:20px;font-weight:900;text-decoration:none;color:inherit}.logo span{color:var(--sky)}
.who{font-size:12.5px;color:var(--sub);text-align:right}
.who button{margin-left:6px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:22px;padding:11px 18px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
.btn.ok{background:var(--ok);color:#04222A}.btn.ghost{background:transparent;color:#DDEAF2;border:1.5px solid #3A6A88}.btn.sm{padding:5px 12px;font-size:12.5px}
.hide{display:none!important}
.login{text-align:center;padding:50px 10px}
.login img{width:84px;height:84px;border-radius:20px}
.login h1{font-size:24px;margin:14px 0 4px}
.login p{color:var(--sub);font-size:14px;margin:4px 0 20px}
.msg{color:#FFB27A;font-size:13px;margin-top:12px;min-height:18px}
.tabs{display:flex;gap:6px;margin:14px 0 4px;overflow-x:auto}
.tab{flex:0 0 auto;border:1.5px solid #3A6A88;border-radius:99px;padding:8px 16px;font-weight:800;font-size:14px;cursor:pointer;background:transparent;color:#DDEAF2;font-family:inherit}
.tab.on{color:#fff}
.tab[data-t=mine].on{background:var(--mine);border-color:var(--mine)}
.tab[data-t=group].on{background:var(--group);border-color:var(--group)}
.tab[data-t=all].on{background:var(--all);border-color:var(--all)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}.stat small{color:var(--sub);font-size:12px}
.sel{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1.5px solid #3A6A88;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:800;cursor:pointer;background:transparent;color:#DDEAF2;font-family:inherit}
.chip.on{background:var(--group);border-color:var(--sky);color:#fff}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px;cursor:pointer;display:flex;gap:12px;align-items:center}
.card:hover{border-color:#3A6A88}
.card .d{width:54px;text-align:center;flex:0 0 auto;border-right:1px solid #1E3446;padding-right:10px}
.card .d b{display:block;font-size:22px;line-height:1.1}.card .d small{color:var(--sub);font-size:11.5px}
.card .m{flex:1;min-width:0}
.card .t{font-weight:800;font-size:15px}
.card .s{color:var(--sub);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .n{font-size:20px;font-weight:900;color:#FFD36E;flex:0 0 auto}
.card .n small{font-size:12px;color:var(--sub);font-weight:400}
.sp{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:#16324A;color:#BFE0FF;margin:3px 4px 0 0}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:7px;color:#fff;margin-left:6px;vertical-align:2px}
.note{color:var(--sub);font-size:13px}
.empty{color:var(--sub);text-align:center;padding:30px 0}
.more{display:block;margin:14px auto 0}
/* 상세 */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#0E1F2C;border:1.5px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:820px;max-height:92vh;overflow-y:auto;padding:14px 16px 30px}
.sheet .hd{display:flex;align-items:center;gap:10px;position:sticky;top:-14px;background:#0E1F2C;padding:4px 0 8px;z-index:5}
.sheet .hd h2{flex:1;font-size:18px;margin:0}
.big{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.big .b{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.big .b b{color:#FFD36E;font-size:18px;margin-left:4px}
h3{font-size:15px;margin:16px 0 6px;color:var(--sky)}
#map{position:relative;z-index:0;isolation:isolate;height:320px;border-radius:14px;border:1.5px solid var(--line);margin-top:6px;background:#12283A}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:6px;padding-top:16px}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bars .c i{display:block;width:100%}.bars .c i:first-of-type{border-radius:4px 4px 0 0}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;margin-top:2px}.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.bars .c span{font-size:10px;color:var(--sub);margin-top:2px}.bars .c em{font-size:10px;color:#FFD36E;font-style:normal}
.rows div{display:flex;justify-content:space-between;border-top:1px solid #1E3446;padding:6px 0;font-size:14px}
.rows div:first-child{border-top:0}
.wx{font-size:13px;color:#B8CAD6;white-space:pre-wrap}
.hg{border:1.5px solid var(--line);border-radius:12px;margin-top:6px;background:var(--card)}
.hg summary{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;list-style:none;font-size:14px}
.hg summary::-webkit-details-marker{display:none}
.hg summary b{color:var(--sky);width:34px}.hg .hs{flex:1;min-width:0;color:#DDEAF2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hg .hn{color:#FFD36E;font-weight:800;font-size:13px}
.hg[open] .hn{color:var(--sub)}
.hg .rows{padding:0 12px 6px}
.mk{position:relative;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.mk img{pointer-events:none}.mk b{color:#1B0E02;font-size:12px}
.mk .tg{position:absolute;top:-9px;left:50%;transform:translateX(-50%);color:#fff;font-size:10px;font-weight:800;padding:0 5px;border-radius:7px;white-space:nowrap;line-height:14px}
.mk .ct{position:absolute;top:-8px;right:-10px;background:#0B1A26;color:#fff;font-size:11px;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.more2{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;background:#0B1A26;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:7px;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.wxt{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.wxt th{color:var(--sub);font-weight:700;font-size:11.5px;text-align:left;padding:4px 6px;border-bottom:1px solid #2C4F66}
.wxt td{padding:5px 6px;border-bottom:1px solid #1E3446}
.wxt small{color:var(--sub)}
.photo{width:100%;max-width:360px;border-radius:14px;margin-top:6px;border:1.5px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
<nav><a class="logo" href="/"><span>talla</span>.co.kr</a><div class="who" id="who"></div></nav>

<div id="setup" class="login hide"><p>⚠ 로그인 준비 중이에요 · 잠시 뒤 다시 열어 주세요</p></div>

<div id="login" class="login hide">
  <img src="img/jogwa.png" alt="">
  <h1>조과일지 웹</h1>
  <p>앱에서 쓰는 <b>같은 구글 계정</b>으로 로그인하면<br>내 조과 · 그룹 출조 기록 · 전체 게시판을 볼 수 있어요</p>
  <button class="btn ok" id="loginBtn">G&nbsp; 구글로 로그인</button>
  <div class="msg" id="loginMsg"></div>
  <p class="note" style="margin-top:26px">보기 전용이에요 · 기록 · 고치기는 앱에서 해요</p>
</div>

<div id="main" class="hide">
  <div class="tabs">
    <button class="tab on" data-t="mine">📒 내 조과</button>
    <button class="tab" data-t="group">👥 그룹</button>
    <button class="tab" data-t="all">📰 전체 게시판</button>
  </div>
  <div id="view"></div>
</div>
</div>

<script src="/__/firebase/10.14.1/firebase-app-compat.js"></script>
<script src="/__/firebase/10.14.1/firebase-auth-compat.js"></script>
<script src="/__/firebase/10.14.1/firebase-firestore-compat.js"></script>
<script src="/__/firebase/init.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function show(id) { ['setup', 'login', 'main'].forEach(function (k) { $(k).classList.toggle('hide', k !== id); }); }
  if (typeof firebase === 'undefined' || !firebase.apps || !firebase.apps.length) { show('setup'); return; }
  var auth = firebase.auth(), db = firebase.firestore();
  var me = null, tab = 'mine';
  var DOW = ['일', '월', '화', '수', '목', '금', '토'];
  function d8(ms) { var d = new Date(ms); return d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate() + ' (' + DOW[d.getDay()] + ')'; }
  function hm(ms) { var d = new Date(ms); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function dur(a, b) { if (!a || !b || b < a) return ''; var m = Math.round((b - a) / 60000); return (m >= 60 ? Math.floor(m / 60) + '시간 ' : '') + (m % 60 ? m % 60 + '분' : ''); }
  function nameOf(names, s) { return (names && names[s - 1]) || (s + '번'); }

  // 출조 하나를 같은 모양으로: {key, src, who, start, end, cat, boat, port, names[], catches:[{t,s,la,lo}], track:[[la,lo]], wx, thumb, ref}
  function counts(t) {
    var m = {};
    t.catches.forEach(function (c) { var n = nameOf(t.names, c.s); m[n] = (m[n] || 0) + 1; });
    return Object.keys(m).map(function (k) { return [k, m[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
  }
  function fromMine(d) {
    try {
      var o = JSON.parse(d.data().json || '{}');
      return { key: 'm' + d.id, src: 'mine', who: '나', start: o.start, end: o.end, cat: o.cat || '', boat: o.boat || '', port: o.port || '', names: o.names || [],
        catches: (o.catches || []).map(function (c) { return { t: c[0], s: c[1], la: c.length >= 4 ? c[2] : null, lo: c.length >= 4 ? c[3] : null }; }),
        track: (o.track || []).map(function (p) { return [p[1], p[2]]; }), wx: o.wx || '' };
    } catch (e) { return null; }
  }
  function fromDoc(d, src, gname) {
    var x = d.data();
    return { key: src[0] + d.id, src: src, who: x.ownerName || x.nick || '?', gname: gname || x.gname || '', start: x.start, end: x.end, cat: x.cat || '', boat: x.boat || '', port: x.port || '',
      names: x.names || [], catches: (x.catches || []).map(function (c) { return { t: c.t, s: c.s, la: c.la == null ? null : c.la, lo: c.lo == null ? null : c.lo }; }),
      track: null, hasTrack: !!x.hasTrack || !!x.pts, wx: x.wx || '', thumb: x.mthumb || '', prec: x.prec, ref: d.ref, total: x.total };
  }

  function card(t) {
    var cs = counts(t), d = new Date(t.start || 0);
    var tot = t.catches.length || t.total || 0;
    var col = { mine: 'var(--mine)', group: 'var(--group)', all: 'var(--all)' }[t.src];
    var sub = [catName(t.cat), t.boat, t.port, dur(t.start, t.end)].filter(Boolean).join(' · ');
    return '<div class="card" data-k="' + esc(t.key) + '"><div class="d"><b>' + d.getDate() + '</b><small>' + (d.getMonth() + 1) + '월 ' + DOW[d.getDay()] + '</small></div>' +
      '<div class="m"><div class="t">' + (t.src === 'mine' ? esc(sub.split(' · ')[0] || '출조') : esc(t.who)) +
      (t.src !== 'mine' ? '<span class="tag" style="background:' + col + '">' + (t.src === 'group' ? esc(t.gname || '그룹') : '전체') + '</span>' : '') + '</div>' +
      '<div class="s">' + esc(d.getFullYear() + '년 · ' + (t.src === 'mine' ? sub.split(' · ').slice(1).join(' · ') : sub)) + '</div>' +
      '<div>' + cs.slice(0, 4).map(function (x) { return '<span class="sp">' + esc(x[0]) + ' ' + x[1] + '</span>'; }).join('') + '</div></div>' +
      '<div class="n">' + tot + '<small>마리</small></div></div>';
  }
  var cache = {};
  function list(arr, el) {
    arr.forEach(function (t) { cache[t.key] = t; });
    el.insertAdjacentHTML('beforeend', arr.map(card).join(''));
  }
  $('view').addEventListener('click', function (e) {
    var c = e.target.closest('.card'); if (c && cache[c.dataset.k]) detail(cache[c.dataset.k]);
  });

  // 📒 내 조과
  function viewMine() {
    var v = $('view'); v.innerHTML = '<p class="note">불러오는 중…</p>';
    db.collection('users').doc(me.uid).collection('trips').orderBy('start', 'desc').get().then(function (q) {
      var all = q.docs.map(fromMine).filter(Boolean);
      var years = {}; all.forEach(function (t) { years[new Date(t.start).getFullYear()] = 1; });
      var ys = Object.keys(years).sort().reverse(), cur = 'all';
      function draw() {
        var l = cur === 'all' ? all : all.filter(function (t) { return String(new Date(t.start).getFullYear()) === cur; });
        var tot = l.reduce(function (s, t) { return s + t.catches.length; }, 0);
        var best = {}; l.forEach(function (t) { counts(t).forEach(function (x) { best[x[0]] = (best[x[0]] || 0) + x[1]; }); });
        var top = Object.keys(best).sort(function (a, b) { return best[b] - best[a]; })[0];
        v.innerHTML = '<div class="sel">' + ['all'].concat(ys).map(function (y) { return '<button class="chip' + (y === cur ? ' on' : '') + '" data-y="' + y + '">' + (y === 'all' ? '전체' : y + '년') + '</button>'; }).join('') + '</div>' +
          '<div class="stats"><div class="stat"><b>' + l.length + '</b><small>출조</small></div><div class="stat"><b>' + tot + '</b><small>마리</small></div><div class="stat"><b>' + esc(top || '-') + '</b><small>가장 많이 · ' + (top ? best[top] : 0) + '</small></div></div>' +
          '<div id="lst"></div>' + (l.length ? '' : '<p class="empty">서버에 백업된 출조가 없어요<br><small>앱에서 출조를 끝내면 자동으로 서버에 백업돼요</small></p>');
        list(l, $('lst'));
        v.querySelectorAll('[data-y]').forEach(function (b) { b.onclick = function () { cur = b.dataset.y; draw(); }; });
      }
      draw();
    }).catch(function (e) { v.innerHTML = '<p class="empty">못 불러왔어요 · ' + esc(e.code || e.message) + '</p>'; });
  }

  // 👥 그룹
  var groups = null, gSel = null;
  function viewGroup() {
    var v = $('view'); v.innerHTML = '<p class="note">불러오는 중…</p>';
    function go() {
      if (!groups.length) { v.innerHTML = '<p class="empty">가입한 그룹이 없어요</p>'; return; }
      if (!gSel) gSel = groups[0].id;
      v.innerHTML = '<div class="sel">' + groups.map(function (g) { return '<button class="chip' + (g.id === gSel ? ' on' : '') + '" data-g="' + g.id + '">' + esc(g.name) + ' · ' + g.n + '명</button>'; }).join('') + '</div><div id="lst"><p class="note">불러오는 중…</p></div>';
      v.querySelectorAll('[data-g]').forEach(function (b) { b.onclick = function () { gSel = b.dataset.g; go(); }; });
      var g = groups.filter(function (x) { return x.id === gSel; })[0];
      var last = null, el = $('lst');
      function page() {
        var q = db.collection('groups').doc(g.id).collection('trips').orderBy('start', 'desc').limit(30);
        if (last) q = q.startAfter(last);
        q.get().then(function (s) {
          if (!last) el.innerHTML = '';
          var old = el.querySelector('.more'); if (old) old.remove();
          last = s.docs[s.docs.length - 1];
          list(s.docs.map(function (d) { return fromDoc(d, 'group', g.name); }), el);
          if (!s.size && !el.children.length) el.innerHTML = '<p class="empty">아직 올린 출조가 없어요</p>';
          if (s.size === 30) { el.insertAdjacentHTML('beforeend', '<button class="btn ghost sm more">⬇ 더 보기</button>'); el.querySelector('.more').onclick = page; }
        }).catch(function (e) { el.innerHTML = '<p class="empty">못 불러왔어요 · ' + esc(e.code || e.message) + '</p>'; });
      }
      page();
    }
    if (groups) return go();
    db.collection('users').doc(me.uid).get().then(function (u) {
      var ids = (u.exists && u.data().groups) || [];
      return Promise.all(ids.map(function (id) { return db.collection('groups').doc(id).get().then(function (g) { return g.exists ? { id: id, name: g.data().name || '그룹', n: (g.data().members || []).length } : null; }).catch(function () { return null; }); }));
    }).then(function (l) { groups = (l || []).filter(Boolean); go(); })
      .catch(function (e) { v.innerHTML = '<p class="empty">못 불러왔어요 · ' + esc(e.code || e.message) + '</p>'; });
  }

  // 📰 전체 게시판
  function viewAll() {
    var v = $('view'); v.innerHTML = '<div id="lst"><p class="note">불러오는 중…</p></div>';
    var last = null, el = $('lst');
    function page() {
      var q = db.collection('public').orderBy('start', 'desc').limit(30);
      if (last) q = q.startAfter(last);
      q.get().then(function (s) {
        if (!last) el.innerHTML = '';
        var old = el.querySelector('.more'); if (old) old.remove();
        last = s.docs[s.docs.length - 1];
        list(s.docs.map(function (d) { return fromDoc(d, 'all'); }), el);
        if (s.size === 30) { el.insertAdjacentHTML('beforeend', '<button class="btn ghost sm more">⬇ 더 보기</button>'); el.querySelector('.more').onclick = page; }
      }).catch(function (e) { el.innerHTML = '<p class="empty">못 불러왔어요 · ' + esc(e.code || e.message) + '</p>'; });
    }
    page();
  }

  // 🌤 그날 날씨: 앱이 저장한 시간별 값 {"h":{시각:{w 바람,d 풍향,g 돌풍,wv 파고,s 수온,t 기온,sk 하늘,pt 비,p 강수확률}},"m":{시각:실측 수온}}
  var DIRS = ['북', '북북동', '북동', '동북동', '동', '동남동', '남동', '남남동', '남', '남남서', '남서', '서남서', '서', '서북서', '북서', '북북서'];
  function dirName(d) { return d == null ? '' : DIRS[Math.round(((d % 360) + 360) % 360 / 22.5) % 16]; }
  function f1(x) { return x == null ? '-' : (Math.round(x * 10) / 10).toString(); }
  function wxTable(t) {
    var o; try { o = typeof t.wx === 'string' ? JSON.parse(t.wx) : t.wx; } catch (e) { return ''; }
    if (!o || !o.h) return '';
    var m = o.m || {};
    var from = (t.start || 0) - 3600000, to = (t.end || t.start || 0) + 3600000;
    var ks = Object.keys(o.h).map(Number).sort(function (a, b) { return a - b; });
    var in_ = ks.filter(function (k) { return k >= from && k <= to; });
    if (!in_.length) in_ = ks.slice(0, 12);
    function sky(h) { if (h.th || (h.c != null && h.c >= 95)) return '⚡'; if (h.pt && h.pt > 0) return h.pt === 3 ? '🌨' : '🌧'; return { 1: '☀', 3: '⛅', 4: '☁' }[h.sk] || (h.c != null ? (h.c <= 1 ? '☀' : h.c <= 3 ? '⛅' : '☁') : ''); }
    var mk = Object.keys(m).map(Number);
    // 기온이 전부 0 이면 못 받은 값 (예전 기록) → 안 보임
    var noT = in_.every(function (k) { return !o.h[k].t; });
    function meas(k) { var best = null; mk.forEach(function (x) { if (Math.abs(x - k) <= 1800000 && (best == null || Math.abs(x - k) < Math.abs(best - k))) best = x; }); return best == null ? null : m[best]; }
    var rows = in_.map(function (k) {
      var h = o.h[k], ms = meas(k);
      return '<tr><td>' + hm(k) + '</td><td>' + sky(h) + (h.t != null && !noT ? ' ' + f1(h.t) + '°' : '') + '</td><td>' + (h.w != null ? dirName(h.d) + ' <b>' + f1(h.w) + '</b>' + (h.g != null ? ' <small>(' + f1(h.g) + ')</small>' : '') : '-') + '</td><td>' + f1(h.wv) + '</td><td>' +
        (ms != null ? '<b style="color:#7FD6FF">' + f1(ms) + '</b>' : f1(h.s)) + '</td></tr>';
    }).join('');
    return '<h3>🌤 그날 날씨' + (o.st ? ' <small class="note">· ' + esc(o.st) + '</small>' : '') + '</h3><div style="overflow-x:auto"><table class="wxt"><tr><th>시각</th><th>하늘 · 기온</th><th>바람 m/s (돌풍)</th><th>파고 m</th><th>수온 ℃</th></tr>' + rows + '</table></div>' +
      '<div class="note">수온 하늘색 = 실측 · 나머지는 예보</div>';
  }

  // 어종 색 = 앱과 같게 (1번 주황 · 2번 하늘 · 3번부터 퀵 버튼 색)
  var QUICK = ['#7C6BD6', '#4CAF7A', '#C9A43A', '#B5567E', '#3F8FD6', '#D9604A', '#5A8F8A', '#8A6A4F'];
  function slotCol(s) { return s === 1 ? '#F28C38' : s === 2 ? '#5BC8DF' : QUICK[((s - 3) % QUICK.length + QUICK.length) % QUICK.length]; }
  // 시간대별 막대 = 앱 BarView 와 같게: 많이 잡힌 순 5색 (6종 넘으면 4색 + 회색 '그 밖')
  var BARC = ['#F28C38', '#5BC8DF', '#6BD08A', '#B48CF0', '#F2D45C'], OTHERC = '#7C8C99';
  // 어종 그림 (앱 그림판 그림 그대로 · img/sp)
  var SP = {"주꾸미": "sp_jukkumi", "문어": "sp_muneo", "낙지": "sp_nakji", "갑오징어": "sp_gabo", "오징어": "sp_ojingeo", "한치": "sp_hanchi", "군소": "sp_gunso", "우럭": "sp_ureok", "광어": "sp_gwangeo", "도다리": "sp_dodari", "참돔": "sp_chamdom", "감성돔": "sp_gamseong", "돌돔": "sp_doldom", "노래미": "sp_noraemi", "쥐노래미": "sp_jwinoraemi", "놀래기": "sp_nollaegi", "볼락": "sp_bollak", "농어": "sp_nongeo", "삼치": "sp_samchi", "학꽁치": "sp_hakkong", "갈치": "sp_galchi", "쥐치": "sp_jwichi", "전갱이": "sp_jeongaeng", "복어": "sp_bogeo", "숭어": "sp_sungeo", "게르치": "sp_gereuchi", "대구": "sp_daegu", "부시리": "sp_busiri", "방어": "sp_bangeo", "붉바리": "sp_bulbari", "능성어": "sp_neungseong", "민어": "sp_mineo", "옥돔": "sp_okdom", "열기": "sp_yeolgi", "성대": "sp_seongdae", "양태": "sp_yangtae", "보리멸": "sp_borimyeol", "뱅어": "sp_baengeo", "갯장어": "sp_gaetjangeo", "붕장어": "sp_bungjangeo", "붕어": "sp_bungeo", "잉어": "sp_ingeo", "배스": "sp_bass", "메기": "sp_megi", "가물치": "sp_gamulchi", "맛조개": "sp_matjogae", "조개": "sp_gaejogae", "백합": "sp_baekhap", "피조개": "sp_pijogae", "바지락": "sp_bajirak", "동죽": "sp_dongjuk", "홍합": "sp_honghap", "키조개": "sp_kijogae", "굴": "sp_gul", "가리비": "sp_garibi", "전복": "sp_jeonbok", "소라": "sp_sora", "꽃게": "sp_kkotge", "박하지": "sp_bakhaji", "작은게": "sp_smallcrab", "칠게": "sp_chilge", "대게": "sp_daege", "홍게": "sp_hongge", "대하": "sp_daeha", "보리새우": "sp_borisaeu", "갯가재": "sp_gatgajae", "쏙": "sp_ssok", "성게": "sp_seongge", "멍게": "sp_meongge", "해삼": "sp_haesam"};
  var SPK = Object.keys(SP).sort(function (a, b) { return b.length - a.length; });
  function artOf(n) {
    n = String(n || '').replace(/\s/g, '');
    if (/쭈꾸미|주꾸미/.test(n)) return SP['주꾸미']; if (/갑오/.test(n)) return SP['갑오징어']; if (/무늬/.test(n)) return SP['오징어'];
    for (var i = 0; i < SPK.length; i++) if (n.indexOf(SPK[i]) >= 0) return SP[SPK[i]];
    return '';
  }
  var CATN = { boat: '선상낚시', night: '해루질', walk: '워킹낚시', fresh: '민물낚시' };
  function catName(c) { return CATN[c] || c; }

  // 🐟 잡은 시각: 1시간씩 접어서 ('07시 · 주꾸미 5 · 갑오징어 1 · 6마리 ▾')
  function hourGroups(t) {
    var g = {}, order = [];
    t.catches.slice().sort(function (a, b) { return a.t - b.t; }).forEach(function (c, i) {
      var h = new Date(c.t).getHours(); if (!g[h]) { g[h] = []; order.push(h); } g[h].push([i + 1, c]);
    });
    return order.map(function (h) {
      var l = g[h], m = {};
      l.forEach(function (x) { var n = nameOf(t.names, x[1].s); m[n] = (m[n] || 0) + 1; });
      var sum = Object.keys(m).sort(function (a, b) { return m[b] - m[a]; }).map(function (n) { return esc(n) + ' ' + m[n]; }).join(' · ');
      return '<details class="hg"><summary><b>' + ('0' + h).slice(-2) + '시</b><span class="hs">' + sum + '</span><span class="hn">' + l.length + '마리 ▾</span></summary><div class="rows">' +
        l.map(function (x) { return '<div><span><span class="dot" style="background:' + slotCol(x[1].s) + '"></span>' + x[0] + '. ' + esc(nameOf(t.names, x[1].s)) + '</span><span class="note">' + hm(x[1].t) + '</span></div>'; }).join('') + '</div></details>';
    }).join('');
  }

  // 상세 (밑에서 올라오는 창)
  var map = null;
  function detail(t) {
    var cs = counts(t), tot = t.catches.length;
    var dim = document.createElement('div'); dim.className = 'dim';
    // 시간대별 막대 (어종별로 쌓기 · 앱과 같은 색)
    var rank = cs.map(function (x) { return x[0]; });
    var many = rank.length > 5;
    function bcol(n) { var i = rank.indexOf(n); return many ? (i < 4 ? BARC[i] : OTHERC) : BARC[i] || OTHERC; }
    // 출조 시작 시각부터 1시간 칸 (자정 넘겨도 순서대로)
    var base = new Date(t.start || 0); base.setMinutes(0, 0, 0); base = base.getTime();
    var hrs = {}; t.catches.forEach(function (c) { var h = Math.floor((c.t - base) / 3600000), n = nameOf(t.names, c.s); hrs[h] = hrs[h] || {}; hrs[h][n] = (hrs[h][n] || 0) + 1; });
    function hsum(h) { var o = hrs[h] || {}; return Object.keys(o).reduce(function (a, k) { return a + o[k]; }, 0); }
    var hk = Object.keys(hrs).map(Number);
    var h0 = Math.min.apply(null, hk.concat([0])), h1 = Math.max.apply(null, hk.concat([Math.floor(((t.end || t.start) - base) / 3600000)]));
    var mx = Math.max.apply(null, hk.map(hsum).concat([1]));
    var bars = ''; for (var h = h0; h <= h1 && h - h0 < 30; h++) {
      var o = hrs[h] || {}, n0 = hsum(h), stack = '', clock = new Date(base + h * 3600000).getHours();
      rank.slice().reverse().forEach(function (n) { if (o[n]) stack += '<i style="height:' + (o[n] / mx * 80) + '%;background:' + bcol(n) + '" title="' + esc(n) + ' ' + o[n] + '"></i>'; });
      bars += '<div class="c" title="' + clock + '시: ' + esc(Object.keys(o).map(function (k) { return k + ' ' + o[k]; }).join(' · ')) + '">' + (n0 ? '<em>' + n0 + '</em>' : '') + stack + '<span>' + clock + '</span></div>';
    }
    var legend = '<div class="leg">' + (many ? rank.slice(0, 4) : rank).map(function (n) { return '<span><i style="background:' + bcol(n) + '"></i>' + esc(n) + ' ' + cs.filter(function (x) { return x[0] === n; })[0][1] + '</span>'; }).join('') +
      (many ? '<span><i style="background:' + OTHERC + '"></i>그 밖 ' + cs.slice(4).reduce(function (a, x) { return a + x[1]; }, 0) + '</span>' : '') + '</div>';
    var hasPts = t.catches.some(function (c) { return c.la != null; });
    dim.innerHTML = '<div class="sheet"><div class="hd"><h2>' + esc(d8(t.start)) + (t.src !== 'mine' ? ' · ' + esc(t.who) : '') + '</h2><button class="btn ghost sm" id="x">닫기</button></div>' +
      '<div class="note">' + esc([catName(t.cat), t.boat, t.port, hm(t.start) + (t.end ? ' ~ ' + hm(t.end) : ''), dur(t.start, t.end), t.gname].filter(Boolean).join(' · ')) + '</div>' +
      '<div class="big"><div class="b">총<b>' + (tot || t.total || 0) + '</b>마리</div>' + cs.map(function (x) { var sl = (t.names || []).indexOf(x[0]) + 1; return '<div class="b"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:' + (sl > 0 ? slotCol(sl) : '#9FB4C2') + '"></span>' + esc(x[0]) + '<b>' + x[1] + '</b></div>'; }).join('') + '</div>' +
      (t.thumb ? '<h3>📷 대표 사진</h3><img class="photo" src="data:image/jpeg;base64,' + t.thumb + '">' : '') +
      (tot ? '<h3>⏰ 시간대별</h3>' + legend + '<div class="bars">' + bars + '</div>' : '') +
      '<h3>🗺 지도</h3><div id="map"></div><div class="note" id="mapNote">' + (t.src === 'all' && t.prec !== 'exact' && t.prec !== true ? '게시판 글은 위치가 대략일 수 있어요' : '') + '</div>' +
      wxTable(t) +
      (tot ? '<h3>🐟 잡은 시각 <small class="note">· 시간을 누르면 펼쳐져요</small></h3>' + hourGroups(t) : '') +
      '</div>';
    document.body.appendChild(dim); document.body.style.overflow = 'hidden';
    function close() { if (map) { map.remove(); map = null; } dim.remove(); document.body.style.overflow = ''; }
    dim.addEventListener('click', function (e) { if (e.target === dim) close(); });
    dim.querySelector('#x').onclick = close;
    if (typeof L === 'undefined') { $('map').outerHTML = '<p class="note">지도를 못 불러왔어요</p>'; return; }
    map = L.map('map', { zoomControl: true }).setView([36.5, 126.5], 7);
    // 앱과 같게: 기본 = 위성 사진(Esri) · 오른쪽 위에서 [위성 | 지도] 바꾸기 (브라우저에 기억)
    var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, attribution: 'Esri' });
    var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' });
    var useSat = true; try { useSat = localStorage.getItem('app_sat') !== '0'; } catch (e) {}
    (useSat ? sat : osm).addTo(map);
    L.control.layers({ '🛰 위성': sat, '🗺 지도': osm }, null, { position: 'topright' }).addTo(map);
    map.on('baselayerchange', function (e) { try { localStorage.setItem('app_sat', e.layer === sat ? '1' : '0'); } catch (x) {} });
    var b = [];
    function drawTrack(pts) {
      if (!pts || pts.length < 2) return;
      // 이동 경로 = 앱과 같은 분홍 선 (어두운 테두리)
      L.polyline(pts, { color: '#5A0F3A', weight: 6, opacity: .9 }).addTo(map);
      L.polyline(pts, { color: '#FF3EA5', weight: 3.5, opacity: 1 }).addTo(map); pts.forEach(function (p) { b.push(p); });
      if (mk) mk.eachLayer(function (l) { l.setZIndexOffset && l.setZIndexOffset(1000); });
      fit();
    }
    // 잡은 자리 = 앱 지도와 같게: 가까운 점은 묶어서 어종 그림 + 이마 이름표 + 마릿수
    var pts = t.catches.filter(function (c) { return c.la != null; });
    pts.forEach(function (c) { b.push([c.la, c.lo]); });
    var mk = L.layerGroup().addTo(map);
    function drawDots() {
      mk.clearLayers();
      var cl = [];
      pts.forEach(function (c) {
        var p = map.latLngToLayerPoint([c.la, c.lo]);
        var g = null; for (var i = 0; i < cl.length; i++) if (Math.abs(cl[i].p.x - p.x) < 34 && Math.abs(cl[i].p.y - p.y) < 34) { g = cl[i]; break; }
        if (g) g.l.push(c); else cl.push({ p: p, l: [c] });
      });
      cl.forEach(function (g) {
        var cnt = {}; g.l.forEach(function (c) { var n = nameOf(t.names, c.s); cnt[n] = cnt[n] || { n: 0, s: c.s }; cnt[n].n++; });
        var top = Object.keys(cnt).sort(function (a, b) { return cnt[b].n - cnt[a].n; });
        var n = g.l.length, rad = Math.round(17 + Math.min(n, 60) * 0.12), bg = slotCol(cnt[top[0]].s);
        var blue = /^#5B|^#3F|^#9A/i.test(bg);
        var art = artOf(top[0]);
        var html = '<div class="mk" style="width:' + rad * 2 + 'px;height:' + rad * 2 + 'px;background:' + bg + '">' +
          (art ? '<img src="img/sp/' + art + '.webp" style="width:' + rad * 1.6 + 'px">' : '<b>' + esc(top[0].slice(0, 2)) + '</b>') +
          '<span class="tg" style="background:' + (blue ? '#0B6E86' : '#E8505B') + '">' + esc(top[0]) + '</span><span class="ct">' + n + '</span></div>' +
          (top.length >= 2 ? '<div class="more2">' + esc(top[0]) + ' 외 ' + (top.length - 1) + '종</div>' : '');
        var la = g.l.reduce(function (a, c) { return a + c.la; }, 0) / n, lo = g.l.reduce(function (a, c) { return a + c.lo; }, 0) / n;
        L.marker([la, lo], { icon: L.divIcon({ className: '', html: html, iconSize: [rad * 2, rad * 2], iconAnchor: [rad, rad] }) }).addTo(mk)
          .bindPopup('<b>' + top.map(function (k) { return esc(k) + ' ' + cnt[k].n; }).join(' · ') + '</b><br>' + g.l.map(function (c) { return hm(c.t); }).slice(0, 30).join(' · '));
      });
    }
    map.on('zoomend', drawDots);
    function fit() { if (b.length) map.fitBounds(b, { padding: [30, 30], maxZoom: 12 }); }
    fit();
    drawDots();
    if (t.track) drawTrack(t.track);
    else if (t.hasTrack && t.ref) {
      var tr = t.src === 'group' ? t.ref.collection('detail').doc('track') : t.ref.collection('photos').doc('track');
      tr.get().then(function (d) { var p = d.exists && d.data().pts; if (p) drawTrack(p.map(function (x) { return [x.la, x.lo]; })); }).catch(function () {});
    }
    if (!hasPts && !t.hasTrack && !(t.track && t.track.length)) $('mapNote').textContent = '위치 기록이 없어요';
    setTimeout(function () { map && map.invalidateSize(); fit(); }, 200);
  }

  function go(t) {
    tab = t;
    document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.dataset.t === t); });
    if (t === 'mine') viewMine(); else if (t === 'group') viewGroup(); else viewAll();
  }
  document.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { go(b.dataset.t); }; });

  $('loginBtn').onclick = function () {
    var p = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(p).catch(function (e) {
      if (/popup-blocked|operation-not-supported/i.test(e.code || '')) return auth.signInWithRedirect(p);
      if (/cancel|closed/i.test(e.code || '')) return;
      $('loginMsg').textContent = '로그인 실패 · ' + (e.code || e.message);
    });
  };
  auth.onAuthStateChanged(function (u) {
    me = u;
    if (!u) { $('who').innerHTML = ''; show('login'); return; }
    $('who').innerHTML = esc(u.displayName || u.email) + ' <button class="btn ghost sm" id="out">로그아웃</button>';
    $('out').onclick = function () { groups = null; gSel = null; auth.signOut(); };
    show('main'); go(tab);
  });
})();
</script>
<script src="menu.js"></script>
</body>
