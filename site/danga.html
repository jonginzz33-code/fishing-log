          if (OCRBUSY[a.id] !== m) { OCRBUSY[a.id] = m; var b = document.querySelector('[data-ocr="' + ai + '"]'); if (b) b.textContent = '⏳ ' + m; var bm = document.querySelector('.ocrmsg.busy'); if (bm) bm.textContent = '⏳ ' + m + ' · 한 표에 10~40초 걸려요'; }
        });
      }).then(function (res) {
        lastCols = res.colsAbs;
        sec.rows.forEach(function (row, ri) {
          var vals = res.v[ri] || [];
          row.v = sec.cols.map(function (c, ci) { return [vals[ci * 3], vals[ci * 3 + 1], vals[ci * 3 + 2]].map(function (x) { return x === undefined ? null : x; }); });
        });
        res.unsure.forEach(function (u) { unsure.push([si, u[0], Math.floor(u[1] / 3), u[1] % 3].join(',')); });
        total += sec.rows.length * sec.cols.length * 3;
      });
    });
  });
  return chain.then(function () {
    var hadNums = prevSnap.some(function (sc) { return sc.rows.some(function (r) { return (r.v || []).some(function (c) { return c && c.some(function (x) { return x != null; }); }); }); });
    var today = (new Date().getMonth() + 1) + '/' + new Date().getDate();
    // 같은 날 다시 읽기면 '이전 날짜 대비' 비교는 그대로 둠 (지난번엔 다시 읽을 때마다 비교 기준이 지워졌음)
    if (hadNums && a.date !== today) { a.prev = prevSnap; a.prevDate = a.date || '직전'; } else if (!hadNums) { delete a.prev; }
    a.date = today;
    var diff = 0; a.sections.forEach(function (sc, si2) { sc.rows.forEach(function (r, ri) { (r.v || []).forEach(function (c, ci) { (c || []).forEach(function (x, ti) { var o = ((((prevSnap[si2] || {}).rows || [])[ri] || {}).v || [])[ci]; if (hadNums && (o ? o[ti] : null) !== x) diff++; }); }); }); });
    a.unsure = unsure;
    var got = numCount(a);
    var hm = new Date().toTimeString().slice(0, 5);
    OCRMSG[a.id] = '✅ ' + hm + ' 읽기 끝 · ' + got + '/' + total + '칸' + (hadNums ? (diff ? ' · 방금 바뀐 칸 ' + diff + '개' : ' · 지난번과 똑같아요 (바뀐 칸 없음)') : '') + (unsure.length ? ' · 빨간 칸 ' + unsure.length + '개 확인' : '');
    delete OCRBUSY[a.id]; save(); render();
    if (quiet) return { name: a.name, got: got, total: total, unsure: unsure.length, diff: hadNums ? diff : -1, warns: warns };
    var mEl = document.getElementById('ocrmsg' + ai); if (mEl) { mEl.scrollIntoView({ block: 'center', behavior: 'smooth' }); mEl.classList.remove('flash'); void mEl.offsetWidth; mEl.classList.add('flash'); }
    if (warns.length) alert('⚠ 확인해 주세요\n' + warns.join('\n'));
    if (got < total * 0.3) { alert('숫자를 거의 못 찾았어요 (' + got + ' / ' + total + '칸).\n사진의 숫자 칸 위치가 달라서예요. 📐 영역 맞추기 화면에서 숫자 칸 왼쪽 위 → 오른쪽 아래를 눌러 주세요.'); setRegions(ai, 0, true); return; }
    toast('✅ ' + total + '칸 읽었어요' + (unsure.length ? ' · 빨간 칸 ' + unsure.length + '개 확인해 주세요' : '') + ' · 💾 저장');
  }).catch(function (e) { delete OCRBUSY[a.id]; OCRMSG[a.id] = '❌ 읽기 실패 · ' + (e.message || e); render(); if (quiet) return { name: a.name, err: '읽기 실패 · ' + (e.message || e) }; alert('❌ 숫자 읽기 실패 · ' + (e.message || e)); });
}
// 🔢 단가 수집: 사진 있는 업체를 차례로 한 번에 읽기 → 결과 한 번에 알림 → 💾 저장
var ALLRUN = false, ALLSTEP = '';
function picAgs() { return S.ags.filter(function (a) { return IMGS[a.id] || a.imgN; }); }
function allBtnHtml() {
  var n = picAgs().length;
  if (!n) return '<div class="note">📷 [📋 단가표 입력] 탭에서 업체마다 단가표 사진을 올리면 여기 <b>🔢 단가 수집</b> 버튼 하나로 한 번에 읽어요. <button class="btn sm" data-go="sheet">📷 사진 올리러 가기</button></div>';
  return '<button class="btn pri" id="allBtn" style="width:100%;margin:8px 0;padding:14px;font-size:16px"' + (ALLRUN ? ' disabled' : '') + '>' + (ALLRUN ? '⏳ ' + esc(ALLSTEP) + ' 읽는 중…' : '🔢 단가 수집 · 사진 있는 ' + n + '곳 한 번에 읽기') + '</button>';
}
function runAll() {
  if (ALLRUN) return;
  var list = picAgs(); if (!list.length) return alert('사진 올린 업체가 없어요');
  ALLRUN = true; var res = [], i = 0;
  function waitPic(a, n) { return new Promise(function (ok) { (function w(k) { if (IMGS[a.id] || k > 60) ok(); else setTimeout(function () { w(k + 1); }, 250); })(0); }); }
  function next() {
    if (i >= list.length) return finish();
    var a = list[i++], ai = S.ags.indexOf(a); ALLSTEP = i + '/' + list.length + ' ' + a.name; render();
    return waitPic(a).then(function () { if (!IMGS[a.id]) return { name: a.name, err: '사진을 못 불러왔어요' }; return runOcr(ai, true); })
      .then(function (r) { res.push(r || { name: a.name, err: '읽기 안 됨' }); return next(); });
  }
  function finish() {
    ALLRUN = false; ALLSTEP = ''; S.tab = 'cmp'; render();
    var lines = res.map(function (r) {
      if (r.err) return '❌ ' + r.name + ' · ' + r.err;
      var low = r.got < r.total * 0.3;
      return (low ? '⚠ ' : '✅ ') + r.name + ' · ' + r.got + '/' + r.total + '칸' + (r.unsure ? ' · 빨간 칸 ' + r.unsure : '') + (r.diff > 0 ? ' · 바뀐 칸 ' + r.diff : '') + (low ? ' · 숫자를 거의 못 찾음 → 📐 영역 맞추기' : '') + (r.warns.length ? '\n   ' + r.warns.join('\n   ') : '');
    });
    saveNow();
    alert('🔢 단가 수집 끝 (' + res.length + '곳)\n' + lines.join('\n') + '\n\n💾 저장했어요. 빨간 칸만 사진과 맞춰 보세요.');
  }
  next();
}
// 영역 맞추기: 숫자 칸 전체의 왼쪽 위 → 오른쪽 아래 두 번 누르기 (표마다)
function setRegions(ai, si, all) {
  var a = S.ags[ai], regs = regsOf(a), urls = IMGS[a.id] || [];
  if (!urls.length) return alert('먼저 단가표 사진을 올려 주세요');
  var sec = a.sections[si], cur = { img: regs[si] ? regs[si].img || 0 : 0 }, taps = [], zoom = 100, saved = regs[si];
  function head() {
    return '<h3><span>📐 표 ' + (si + 1) + '/' + a.sections.length + ' 숫자 칸 영역</span><button class="btn sm" data-close>닫기</button></h3>' +
      '<p class="sub">숫자 칸 전체(모델 · 금액 칸 빼고)의 <b>첫 줄 첫 칸 왼쪽 위</b> → <b>마지막 줄 마지막 칸 오른쪽 아래</b>를 차례로 누르세요. 대충 눌러도 표 선에 맞춰져요. 초록 격자가 칸과 맞으면 저장.<br>이 표: 모델 ' + sec.rows.length + '줄 · 요금제 ' + sec.cols.length + '열(칸 ' + sec.cols.length * 3 + '개) · ' + esc(sec.rows[0] ? sec.rows[0].name : '') + ' ~ ' + esc(sec.rows.length ? sec.rows[sec.rows.length - 1].name : '') + '</p>' +
      (urls.length > 1 ? '<div class="row">' + urls.map(function (u, k) { return '<button class="chip' + ((cur.img || 0) === k ? ' on' : '') + '" data-rimg="' + k + '">사진 ' + (k + 1) + '</button>'; }).join('') + '</div>' : '') +
      '<div class="row" style="margin:6px 0"><button class="btn sm" data-rz="-1">－</button><span class="sub">' + zoom + '%</span><button class="btn sm" data-rz="1">＋</button><span id="rmsg" class="sub"></span></div>' +
      '<div id="rbox" style="position:relative;overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:10px;background:#fff"><div style="position:relative;width:' + zoom + '%"><img id="rimg" src="' + urls[cur.img || 0] + '" style="width:100%;display:block"><canvas id="rcv" style="position:absolute;left:0;top:0;width:100%;height:100%"></canvas></div></div>' +
      '<div class="row" style="margin-top:10px"><button class="btn pri" id="rsave">이대로 저장' + (all && si < a.sections.length - 1 ? ' → 다음 표' : '') + '</button><button class="btn sm" id="rreset">다시 찍기</button></div>';
  }
  openSheet(head(), function wire(sh) {
    var img = sh.querySelector('#rimg'), cv = sh.querySelector('#rcv');
    function draw() {
      if (!img.naturalWidth) return;
      cv.width = img.naturalWidth; cv.height = img.naturalHeight;
      var g = cv.getContext('2d'), W = cv.width, H = cv.height; g.clearRect(0, 0, W, H);
      g.lineWidth = Math.max(2, W / 500);
      taps.forEach(function (t) { g.fillStyle = '#E8892A'; g.beginPath(); g.arc(t[0] * W, t[1] * H, g.lineWidth * 4, 0, 7); g.fill(); });
      if (cur.x1 == null) { sh.querySelector('#rmsg').textContent = taps.length ? ' ② 오른쪽 아래를 눌러 주세요' : ' ① 왼쪽 위를 눌러 주세요'; return; }
      var gd = DangaOCR.grid(img, cur, sec.rows.length, sec.cols.length * 3);
      g.strokeStyle = 'rgba(47,191,143,.9)';
      gd.rows.forEach(function (y) { g.beginPath(); g.moveTo(gd.X0, gd.Y0 + y); g.lineTo(gd.X0 + gd.w, gd.Y0 + y); g.stroke(); });
      gd.cols.forEach(function (x, k) { g.lineWidth = k % 3 === 0 ? Math.max(3, W / 350) : Math.max(1.5, W / 700); g.beginPath(); g.moveTo(gd.X0 + x, gd.Y0); g.lineTo(gd.X0 + x, gd.Y0 + gd.h); g.stroke(); });
      sh.querySelector('#rmsg').textContent = gd.exact ? ' ✅ 표 선과 딱 맞아요' : ' 격자가 칸과 맞는지 확인해 주세요';
    }
    function fromSaved() {
      if (!saved || cur.x1 != null || taps.length) return;
      var f = DangaOCR.autoRegion(img, saved.h ? saved : DangaOCR.toHint(img, saved), sec.rows.length, sec.cols.length * 3);
      if (f) cur = { img: cur.img, x0: f.x0, y0: f.y0, x1: f.x1, y1: f.y1 };
    }
    if (img.complete) { fromSaved(); draw(); } else img.onload = function () { fromSaved(); draw(); };
    cv.addEventListener('click', function (e) {
      var r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      if (taps.length >= 2) taps = [];
      taps.push([x, y]);
      if (taps.length === 2) {
        var rg = { img: cur.img || 0, x0: Math.min(taps[0][0], taps[1][0]), y0: Math.min(taps[0][1], taps[1][1]), x1: Math.max(taps[0][0], taps[1][0]), y1: Math.max(taps[0][1], taps[1][1]) };
        var sn = DangaOCR.snap(img, rg); cur = { img: rg.img, x0: sn.x0, y0: sn.y0, x1: sn.x1, y1: sn.y1 };
      } else cur = { img: cur.img || 0 };
      draw();
    });
    sh.onclick = function (e) {
      var t = e.target;
      if (t.dataset.rimg) { cur = { img: +t.dataset.rimg }; taps = []; sh.innerHTML = head(); wire(sh); }
      if (t.dataset.rz) { zoom = Math.max(100, Math.min(400, zoom + 100 * t.dataset.rz)); sh.innerHTML = head(); wire(sh); }
      if (t.id === 'rreset') { taps = []; cur = { img: cur.img || 0 }; draw(); }
      if (t.id === 'rsave') {
        if (cur.x1 == null) return alert('두 군데를 눌러 영역을 정해 주세요');
        regs[si] = Object.assign({ img: cur.img || 0, h: 1 }, DangaOCR.toHint(img, cur)); save(); document.getElementById('modal').classList.add('hide');
        if (si + 1 < a.sections.length && (all || !regs[si + 1])) setRegions(ai, si + 1, all);
        else if (!all) runOcr(ai); else toast('영역 저장했어요 · 🔢 사진에서 숫자 읽기');
      }
    };
  });
}

// 관리자 로그인 → 클라우드 자료 불러오기
function gate(html) { document.getElementById('tabs').innerHTML = ''; document.getElementById('view').innerHTML = '<div class="card" style="text-align:center;padding:28px">' + html + '</div>'; }
function start() {
  load();
  // 2026-11-28: 사이트 비교는 구글 관리자 로그인 필요 없음 (계정은 아이디 · 비밀번호, 관리자는 열쇠) → 예전 구글 문 건너뜀
  if (true) { S.fixMsgs = []; render(); return; }
  if (!window.firebase || !firebase.apps || !firebase.apps.length) { setCloud('⚠ 로그인 없이 이 브라우저에만 저장 중'); importHash().then(function () { fillEmpty(); S.fixMsgs = fixData(); render(); }); return; }
  var auth = firebase.auth();
  gate('⏳ 확인 중…');
  auth.onAuthStateChanged(function (u) {
    if (!u) {
      gate('<h2 style="justify-content:center">🔐 관리자 전용</h2><p class="sub">단가 자료는 관리자 구글 계정으로만 보고 고칠 수 있어요.</p><button class="btn pri" id="login">구글로 로그인</button><p class="sub" id="lmsg"></p>');
      document.getElementById('login').onclick = function () { var p = new firebase.auth.GoogleAuthProvider(); auth.signInWithPopup(p).catch(function (e) { if (/popup|cancel/i.test(e.code || '')) return auth.signInWithRedirect(p); document.getElementById('lmsg').textContent = '로그인 실패 · ' + (e.code || e.message); }); };
      return;
    }
    if ((u.email || '').toLowerCase() !== ADMIN) { gate('<h2 style="justify-content:center">권한이 없어요</h2><p class="sub">' + esc(u.email) + '</p><button class="btn" id="lo">로그아웃</button>'); document.getElementById('lo').onclick = function () { auth.signOut(); }; return; }
    var ref = firebase.firestore().collection('adminNotes').doc('danga');
    ref.get().then(function (d) {
      var x = d.data();
      if (x && x.j) { try { S.ags = JSON.parse(x.j); load2(); lastAgs = x.j; ls(LS, JSON.stringify(S)); setCloud('☁ 불러옴 ' + new Date(x.t).toLocaleString('ko-KR')); } catch (e) {} }
      else setCloud('☁ 아직 클라우드에 자료가 없어요');
      CLOUD = ref; loadImgs();
      return importHash();
    }).catch(function (e) { setCloud('⚠ 클라우드 읽기 실패 · ' + (e.code || e.message) + ' · 이 브라우저 자료로 보여 줘요'); }).then(function () { fillEmpty(); var fx = fixData(); save(); render(); if (fx.length) setTimeout(function () { toast('🔧 계산 바로잡음 ' + fx.length + '건 (⚙ 설정 → 계산 점검)'); }, 600); S.fixMsgs = fx; });
  });
}
// 이미 열린 단가 페이지에서 링크를 눌러도(주소 # 만 바뀌어 새로 안 읽힘) 바로 넣기
function importNow(src) { importHash(src).then(function () { fixData(); save(); render(); paintSave(); }); }
window.addEventListener('hashchange', function () { if (/data=/.test(location.hash)) importNow(); });
window.addEventListener('beforeunload', function (e) { if (dirty()) { e.preventDefault(); e.returnValue = ''; } });
start();
})();
