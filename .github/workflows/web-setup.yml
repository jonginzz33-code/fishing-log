name: Web setup
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Check perms · web app · auth domains · monitoring · api keys
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          pip -q install google-auth requests
          python3 - <<'P'
          import os, json, time, datetime, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          cr = service_account.Credentials.from_service_account_file(os.environ["RUNNER_TEMP"]+"/sa.json", scopes=["https://www.googleapis.com/auth/cloud-platform", "https://www.googleapis.com/auth/firebase"])
          cr.refresh(Request())
          PJ = "fishing-log-9109d"
          H = {"Authorization": "Bearer " + cr.token, "x-goog-user-project": PJ}
          def say(*a): print("OUT", *[str(x).replace(PJ, "PJ").replace("jonginzz33", "U") for x in a])
          apps = requests.get(f"https://firebase.googleapis.com/v1beta1/projects/{PJ}/webApps", headers=H).json().get("apps", [])
          wk = requests.get(f"https://firebase.googleapis.com/v1beta1/{apps[0]['name']}/config", headers=H).json().get("apiKey") if apps else ""
          e = requests.post(f"https://serviceusage.googleapis.com/v1/projects/{PJ}/services/apikeys.googleapis.com:enable", headers=H)
          say("enable apikeys", e.status_code)
          # api keys
          r = requests.get(f"https://apikeys.googleapis.com/v2/projects/{PJ}/locations/global/keys", headers=H)
          for k in r.json().get("keys", []):
              rs = k.get("restrictions", {})
              ks = requests.get(f"https://apikeys.googleapis.com/v2/{k['name']}/keyString", headers=H).json().get("keyString", "")
              say("key", "WEB" if ks == wk else "-", k.get("displayName"), list(rs.keys()), [x.get("packageName") for x in rs.get("androidKeyRestrictions", {}).get("allowedApplications", [])][:3], [" ".join(x) for x in rs.get("browserKeyRestrictions", {}).get("allowedReferrers", [])], len(rs.get("apiTargets", [])))
          if r.status_code != 200: say("keys", r.status_code, (r.json().get("error") or {}).get("message", "")[:150])
          P
