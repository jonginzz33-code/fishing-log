name: Homepage
on:
  push:
    branches: [main]
    paths: ['site/**', 'firebase.json', 'firestore.rules', '.github/workflows/hosting.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Copy rules for talla.co.kr/rules
        run: cp firestore.rules site/rules.txt
      - name: Deploy to Firebase Hosting
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy --only hosting --project fishing-log-9109d --non-interactive
