name: Homepage
on:
  push:
    branches: [main]
    paths: ['site/**', 'firebase.json', '.github/workflows/hosting.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Deploy to Firebase Hosting
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print('SA email:',d.get('client_email'),'project:',d.get('project_id'))" "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy --only hosting --project fishing-log-9109d --non-interactive --debug 2>&1 | grep -vE "^\[debug\].*(Authorization|token)" | tail -60; test ${PIPESTATUS[0]} -eq 0
