name: Homepage
on:
  push:
    branches: [main]
    paths: ['site/**', 'firebase.json', '.firebaserc', 'firestore.rules', '.github/workflows/hosting.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Copy rules for talla.co.kr/rules
        run: cp firestore.rules site/rules.txt
      - name: Build danga.talla.co.kr (danga page only, no talla menu)
        run: |
          mkdir -p site-danga/img
          sed '/<script src="\/menu.js"><\/script>/d' site/danga.html > site-danga/index.html
          cp site/danga-calc.js site/danga-ocr.js site-danga/
          cp site/img/jogwa.png site-danga/img/ 2>/dev/null || true
      - name: Deploy to Firebase Hosting
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy --only hosting --project fishing-log-9109d --non-interactive
