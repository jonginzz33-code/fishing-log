name: Relay test
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          R="https://talla-relay.jonginzz33.workers.dev/?u="
          curl -s -m 40 "${R}https%3A%2F%2F52fish.thefishing.kr%2Findex.php%3Fmid%3Dbk%26year%3D2026%26month%3D12%26day%3D02" -o /tmp/p.html
          python3 - <<'Q'
          import re
          s=open('/tmp/p.html',encoding='utf-8',errors='ignore').read()
          print("SIZE",len(s),"secs",len(re.findall(r'id="new-div-\d{8}"',s)),"rows",len(re.findall(r'admin-right-\d{8}-\d+-\d+',s)))
          i=s.find('id="new-div-20261202"')
          j=s.find('id="new-div-',i+20)
          seg=s[i:j if j>0 else i+12000]
          k=seg.find('admin-right-')
          print("SEG",re.sub(r'\s+',' ',seg[max(0,k-3500):k+600]))
          Q
