name: Relay test
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          R=https://talla-relay.jonginzz33.workers.dev/?u=
          enc() { python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$1"; }
          for h in ssfish.thefishing.kr yamujin.thefishing.kr; do
            curl -s -m 40 "$R$(enc https://$h/)" -o /tmp/home.html
            echo "HOME $h $(wc -c < /tmp/home.html)"
            grep -oE 'href="[^"]*mid=[^"&]*[^"]*"[^>]*>[^<]{0,30}' /tmp/home.html | sed 's/&amp;/\&/g' | sort -u | head -40 | sed "s/^/LINK $h /"
          done
