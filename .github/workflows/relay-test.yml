name: Relay test
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          R="https://talla-relay.jonginzz33.workers.dev/?u="
          for h in poseidon sungbin noel kyungil; do
            curl -s -m 60 "${R}https%3A%2F%2F$h.sunsang24.com%2Fship%2Fschedule_fleet%2F2026-12-03%2F0%2Fsimple_day1" -o /tmp/$h.html
          done
          python3 - <<'Q'
          import re
          for h in ['poseidon','sungbin','noel','kyungil']:
            d=open(f'/tmp/{h}.html',encoding='utf-8',errors='ignore').read()
            print("==",h,len(d),d.count('ship_unit_ship_no_'))
            print("WON",re.findall(r'[^<>]{0,60}[0-9][0-9,]{3,}\s*원[^<>]{0,30}',d)[:5])
            print("PRICEATTR",re.findall(r'[\w-]*price[\w-]*="?[^"\s>]*',d,re.I)[:8])
            j=d.find('ship_unit_ship_no_')
            print("BLOCK",re.sub(r'\s+',' ',d[j:j+3500]))
          Q
