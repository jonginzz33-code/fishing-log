name: Relay test
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          R="https://talla-relay.jonginzz33.workers.dev/?u="
          for h in ssfish.thefishing.kr yamujin.thefishing.kr jungwonho.thefishing.kr teammansu.kr; do
            curl -s -m 40 "${R}https%3A%2F%2F$h%2Findex.php%3Fmid%3Dgall" -o /tmp/g.html
            python3 - "$h" <<'Q'
          import re,sys
          s=open('/tmp/g.html',encoding='utf-8',errors='ignore').read()
          print("SIZE",sys.argv[1],len(s),"rows",len(re.findall(r'<tr class="bg',s)))
          i=s.find('<tr class="bg')
          if i>=0:
              j=s.find('</tr>',i)
              print("ROW",sys.argv[1],re.sub(r'\s+',' ',s[i:j])[-1600:])
          else:
              k=s.find('wr_uid=')
              print("NOTR",sys.argv[1],re.sub(r'\s+',' ',s[max(0,k-800):k+800]))
          Q
          done
