name: Relay test
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for d in 2026-12-02 2026-12-03 2026-12-05; do echo "DAY $d $(curl -s -m 60 "https://talla-relay.jonginzz33.workers.dev/day?d=$d&h=poseidon.sunsang24.com" | head -c 600)"; done
          echo "MON $(curl -s -m 60 'https://talla-relay.jonginzz33.workers.dev/?u=https%3A%2F%2Fposeidon.sunsang24.com%2Fship%2Fschedule_fleet%2F202612' | grep -o 'data-sdate="[^"]*"' | sort | uniq -c | head -12 | tr '\n' ' ')"
