name: Play Store

# v6.19+ (268): 스토어 등록정보 · 비공개 테스트를 플레이 콘솔에 자동으로
#  - store/listing/** 또는 store/*.png 를 main 에 올리면 → 등록정보 자동 올리기
#  - Actions 탭에서 손으로: listing / closed (비공개 테스트, 테스터 구글 그룹 메일 선택)
on:
  push:
    branches: [ main ]
    paths:
      - 'store/listing/**'
      - 'store/*.png'
  workflow_dispatch:
    inputs:
      action:
        description: 'listing = 등록정보 · closed = 비공개 테스트로 올리기'
        required: true
        default: 'listing'
        type: choice
        options: [ listing, closed ]
      group:
        description: '비공개 테스트 테스터 구글 그룹 메일 (closed 때만, 없으면 비워 둠)'
        required: false
        default: ''

jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-auth requests
      - name: Play Console
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python store/play.py "${{ github.event.inputs.action || 'listing' }}" "${{ github.event.inputs.group }}"
