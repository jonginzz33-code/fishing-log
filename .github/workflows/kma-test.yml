name: KMA key test

# 기상청 API허브 키(KMA_HUB_KEY)가 들어갔는지 · 해양기상부이 자료가 오는지 확인만 해요 (앱은 안 만들어요)
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/kma-test.yml' ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check key and call buoy API
        env:
          KEY: ${{ secrets.KMA_HUB_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "KMA_HUB_KEY 없음 (비밀값 이름 확인)"; exit 1; fi
          echo "KMA_HUB_KEY 있음 · 길이 ${#KEY}"
          TM=$(TZ=Asia/Seoul date -d '-2 hour' +%Y%m%d%H00)
          # 활용신청한 것들 한꺼번에 시험 (2026-11-23)
          T1=$(TZ=Asia/Seoul date -d '-3 hour' +%Y%m%d%H00); T2=$(TZ=Asia/Seoul date -d '-2 hour' +%Y%m%d%H00); D=$(TZ=Asia/Seoul date +%Y%m%d); Y=$(TZ=Asia/Seoul date +%Y)
          B=https://apihub.kma.go.kr/api
          set +e
          try() { echo; echo "==== $1"; rm -f out.txt; curl -s -m 60 -o out.txt -w '[HTTP %{http_code} · %{size_download}B]\n' "$B/$1&authKey=$KEY"; (iconv -f euc-kr -t utf-8 out.txt 2>/dev/null || cat out.txt) | grep -v '^\s*$' | head -n ${2:-25}; }
          try "typ01/url/kma_lhaws.php?tm=$TM&stn=0&help=1" 45
          try "typ01/url/kma_lhaws.php?tm=$T1&stn=0&help=0" 10
          try "typ01/url/kma_kship.php?tm=$TM&help=1" 40
          try "typ01/url/stn_inf.php?inf=SEA_LH&stn=&tm=$TM&help=0" 10
          try "typ01/url/stn_inf.php?inf=LHAWS&stn=&tm=$TM&help=0" 10
