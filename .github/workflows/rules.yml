name: Firestore Rules
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Deploy firestore.rules
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          mkdir -p "$RUNNER_TEMP/r" && cp firestore.rules "$RUNNER_TEMP/r/"
          echo '{"firestore":{"rules":"firestore.rules"}}' > "$RUNNER_TEMP/r/firebase.json"
          cd "$RUNNER_TEMP/r"
          npx -y firebase-tools@13 deploy --only firestore:rules --project fishing-log-9109d --non-interactive
