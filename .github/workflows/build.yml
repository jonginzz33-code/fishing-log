name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # v6.6 이후: GitHub판(APK)은 더 이상 만들지 않아요 (마지막 v6.6 · Releases의 fishing-log.apk / version.txt 그대로)
      #  → 스토어판 AAB만 만들어 플레이 콘솔 내부 테스트에 자동으로 올려요

      # v6.2 (242-4): 플레이 스토어용 AAB (비밀값 PLAY_KEY_PASS 가 있을 때만)
      - name: Build Play AAB
        env:
          KHOA_KEY: ${{ secrets.KHOA_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          PLAY_KEY_PASS: ${{ secrets.PLAY_KEY_PASS }}
        run: |
          if [ -z "$PLAY_KEY_PASS" ]; then echo "::warning::PLAY_KEY_PASS 비밀값이 없어서 스토어용 AAB는 건너뛰어요"; exit 0; fi
          export PLAY_KEYSTORE_FILE="$RUNNER_TEMP/play-upload.p12"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in keystore/play-upload.p12.enc -out "$PLAY_KEYSTORE_FILE" -pass env:PLAY_KEY_PASS
          gradle bundlePlayRelease --no-daemon
          V=$(grep -m1 versionCode app/build.gradle.kts | grep -o '[0-9]\+')
          cp app/build/outputs/bundle/playRelease/app-play-release.aab jogwa-play-$V.aab
          rm -f "$PLAY_KEYSTORE_FILE"

      - name: Publish Play AAB
        if: ${{ hashFiles('jogwa-play-*.aab') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: jogwa-play-*.aab

      # v6.2+: 플레이 콘솔 내부 테스트에 자동으로 올리기 (비밀값 PLAY_SERVICE_ACCOUNT_JSON 이 있을 때만)
      - name: Check Play upload key
        id: playkey
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA" ] && ls jogwa-play-*.aab >/dev/null 2>&1; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::warning::PLAY_SERVICE_ACCOUNT_JSON 이 없어서 플레이 콘솔 자동 올리기는 건너뛰어요"; fi

      - name: Upload to Play internal testing
        if: ${{ steps.playkey.outputs.ok == '1' }}
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: kr.jogwailji.app
          releaseFiles: jogwa-play-*.aab
          tracks: internal
          status: completed
