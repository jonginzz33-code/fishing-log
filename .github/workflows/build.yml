name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk fishing-log.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fishing-log-apk
          path: fishing-log.apk

      # 폰에서 받기 쉽도록 Releases 에도 올림 (항상 최신 = latest)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 조과기록 최신 버전
          body: "커밋 ${{ github.sha }} 에서 자동 빌드"
          files: fishing-log.apk
          make_latest: true
